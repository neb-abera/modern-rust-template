# cargo-deny configuration: the supply-chain gate, run by verify.sh and CI.
# Checks the full dependency graph for security advisories, license
# compliance, duplicate/banned crates and untrusted registries.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the gate. Triage a false positive by adding its id here with a reason.
ignore = []

[licenses]
# Allowlist, not a blocklist: a new dependency with a license not named
# here fails until a human approves it. These are the common permissive
# licenses compatible with releasing under the Unlicense.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "Unlicense",
  "0BSD",
]
confidence-threshold = 0.9

[bans]
# Duplicate versions of one crate bloat builds and usually signal a stale
# dependency; surfaced as a warning, not an error, since transitive graphs
# often need time to converge.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

name: CodeQL

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  # A merge queue tests the queued merge of this PR with the base branch;
  # the required checks must report on that event or the queue waits forever.
  merge_group:
  push:
    branches: [ main, master ]
  schedule:
    # Weekly scan so new queries run even without commits
    - cron: '30 6 * * 1'

permissions:
  contents: read

# A newer push to a pull request makes the running check obsolete. A newer
# push to the default branch does not: cancelling it leaves a merge commit
# with no checks (scripts/check-concurrency.sh enforces this).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            build-mode: none
          - language: actions
            build-mode: none

    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: initialize CodeQL
      uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    - name: perform CodeQL analysis
      uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
      with:
        category: "/language:${{ matrix.language }}"

name: CI

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  # A merge queue tests the queued merge of this PR with the base branch;
  # the required checks must report on that event or the queue waits forever.
  merge_group:
  push:
    branches: [ main, master ]

# Least-privilege token: read-only for all CI jobs.
permissions:
  contents: read

# Outside a pull request each commit gets its own group. A group holds one
# running and one pending run, and a third run cancels the pending one
# whatever cancel-in-progress says. Keyed by branch, that left aberaTech
# 2d7cced and aab70ed with no checks on 2026-09-26. On a pull request a
# newer push still cancels the older run. scripts/check-concurrency.sh
# enforces this.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  # The lint set lives in Cargo.toml [lints]; CI only promotes warnings to
  # errors. Locally the same code merely warns, so development stays fluid.
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # rustup reads rust-toolchain.toml, so the version is pinned in exactly
    # one place and never hardcoded here.
    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: build
      run: cargo build --release --locked

    - name: run tests
      run: cargo test --release --locked 2>&1 | tee test-output.log

    # Benchmark smoke: every Criterion benchmark runs once in test mode, so a
    # harness that no longer builds or panics fails here. It measures
    # nothing: timing on a shared runner is noise. Criterion prints
    # `Success` per benchmark, and zero of them means nothing ran.
    - name: benchmark smoke (build and run once, no timing)
      run: |
        cargo test --benches --release --locked 2>&1 | tee bench-output.log
        ran=$(grep -c '^Success' bench-output.log || true)
        if [ "$ran" -eq 0 ]; then
          echo "::error::no benchmark ran"
          exit 1
        fi
        echo "$ran benchmarks ran once"

    # Size budget, on the Linux leg only (the committed budget is set for
    # Linux x86-64): the same script verify.sh runs, against the release
    # binary built above. The crate name is read from Cargo.toml, as in
    # verify.sh, so a renamed project needs no edits here. The second step
    # is the gate's own canary: one byte over budget, a missing artifact
    # and a missing budget must each fail.
    - name: check the release binary size budget
      if: runner.os == 'Linux'
      run: |
        proj=$(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.toml | head -1)
        ./scripts/check-size-budget.sh "target/release/$proj" size-budget.txt

    - name: prove the size gate can fail (size-budget canary)
      if: runner.os == 'Linux'
      run: |
        proj=$(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.toml | head -1)
        ./scripts/check-size-budget.sh --self-test "target/release/$proj"

    # Job summary: total tests passed/failed, parsed from the cargo test
    # output captured above — the tests are not re-run. Guarded on the env
    # var so the step is a no-op anywhere GITHUB_STEP_SUMMARY is absent.
    - name: append test totals to the job summary
      if: always()
      env:
        MATRIX_OS: ${{ matrix.os }}
      run: |
        [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f test-output.log ] || exit 0
        passed=$(grep -E '^test result:' test-output.log | grep -Eo '[0-9]+ passed' | awk '{s+=$1} END {print s+0}' || true)
        failed=$(grep -E '^test result:' test-output.log | grep -Eo '[0-9]+ failed' | awk '{s+=$1} END {print s+0}' || true)
        {
          echo "### Tests ($MATRIX_OS)"
          echo ""
          echo "| Passed | Failed |"
          echo "| ---: | ---: |"
          echo "| ${passed:-0} | ${failed:-0} |"
        } >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: run clippy over every target
      run: cargo clippy --all-targets --locked

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: rustup toolchain install

    - name: check formatting
      run: cargo fmt --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: build documentation (warnings as errors)
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --lib --locked

  # Miri interprets the test suite and flags undefined behavior — the
  # Rustonomicon material as a gate. Uses the nightly pinned in the
  # Dockerfile, the single place it is written down.
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned nightly with Miri
      run: |
        NIGHTLY=$(sed -n 's/^ENV NIGHTLY_TOOLCHAIN=\(.*\)$/\1/p' Dockerfile)
        rustup toolchain install "$NIGHTLY" --profile minimal --component miri --component rust-src
        echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    # RUSTFLAGS is cleared for Miri only: it changes the sysroot
    # fingerprint, forcing a slow rebuild; warnings-as-errors is already
    # gated by the build and clippy jobs.
    - name: run tests under Miri
      env:
        RUSTFLAGS: ""
      run: cargo +"$NIGHTLY" miri test --locked

  # Kani: the proof gate. Where the test suite samples inputs and Miri watches
  # the sampled runs for undefined behaviour, Kani hands the #[kani::proof]
  # harnesses in src/lib.rs to an SMT solver and settles them for every input.
  # The canary step is the one that matters over time: a proof whose
  # assumptions are too strong reports success while proving nothing, so a
  # planted bug the unit tests cannot see must still make Kani fail.
  kani:
    name: kani
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    # The version comes from the Dockerfile, the single place it is written
    # down, exactly as the miri job derives its nightly. `cargo kani setup`
    # fetches the rustc driver, CBMC and the solvers for that release.
    - name: install pinned Kani
      run: |
        KANI_VERSION=$(sed -n 's/^ENV KANI_VERSION=\(.*\)$/\1/p' Dockerfile)
        cargo install --locked "kani-verifier@$KANI_VERSION"
        cargo kani setup
        echo "KANI_VERSION=$KANI_VERSION" >> "$GITHUB_ENV"

    # RUSTFLAGS is UNSET, not set to the empty string. Kani passes it through
    # to kani-compiler, where an empty value becomes an empty argument and
    # rustc reports "multiple input filenames provided (first two filenames
    # are `-` and ``)". The miri job tolerates `RUSTFLAGS: ""`; this one does
    # not, so `env -u` is used here and in the Makefile alike. Clearing it at
    # all is for the same reason as miri: Kani carries its own sysroot and the
    # flag forces a rebuild of it.
    - name: prove the harnesses
      run: env -u RUSTFLAGS cargo kani

    # Plant a wrong answer at one arbitrary input the four unit tests never
    # sample. The tests must still pass (that is what proof adds over tests)
    # and Kani must fail (that is what makes the proofs load-bearing). Runs
    # last so the mutated tree is never what an earlier step measured.
    - name: prove the proof gate can fail (proof canary)
      run: |
        cp src/lib.rs /tmp/lib.rs.orig
        perl -pi -e 's/^    lhs\.checked_add\(rhs\)$/    if lhs == 0x5EED_BEEF { None } else { lhs.checked_add(rhs) }/' src/lib.rs
        if cmp -s src/lib.rs /tmp/lib.rs.orig; then
          echo "::error::could not plant the canary bug; has src/lib.rs changed?"
          exit 1
        fi
        if ! cargo test --release --locked --no-fail-fast; then
          echo "::error::the unit tests caught the planted bug, so it does not demonstrate what proof adds"
          cp /tmp/lib.rs.orig src/lib.rs
          exit 1
        fi
        if env -u RUSTFLAGS cargo kani; then
          echo "::error::Kani did NOT fail on the planted bug. The proofs are vacuous or not reached."
          cp /tmp/lib.rs.orig src/lib.rs
          exit 1
        fi
        cp /tmp/lib.rs.orig src/lib.rs
        echo "the unit tests passed and Kani failed, as they should"

  # cargo-deny: the supply-chain gate — RustSec advisories, license
  # compliance, duplicate/banned crates and untrusted sources (deny.toml).
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # libFuzzer smoke: the fuzz harness builds and survives a short
  # coverage-guided run. Real fuzzing campaigns run longer or continuously
  # (see the fuzz directory); this gate keeps the harness from rotting.
  # cargo-vet: the other half of the supply-chain gate. cargo-deny judges
  # advisories, licences and sources. This judges whether anyone read the
  # code. --locked reads supply-chain/imports.lock rather than fetching four
  # third-party audit URLs, so the gate is deterministic and a pull request
  # does not depend on someone else's repository being reachable. The
  # self-test runs first: a config that accepted everything would report
  # success forever.
  cargo-vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    # The version comes from the Dockerfile, the single place it is written
    # down, as the miri and kani jobs derive theirs.
    - name: install pinned cargo-vet
      run: |
        CARGO_VET_VERSION=$(sed -n 's/^ENV CARGO_VET_VERSION=\(.*\)$/\1/p' Dockerfile)
        cargo install --locked "cargo-vet@$CARGO_VET_VERSION"

    - name: prove the audit gate can fail
      run: ./scripts/check-vet.sh --self-test

    - name: every dependency is accounted for
      run: ./scripts/check-vet.sh

  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned nightly
      run: |
        NIGHTLY=$(sed -n 's/^ENV NIGHTLY_TOOLCHAIN=\(.*\)$/\1/p' Dockerfile)
        rustup toolchain install "$NIGHTLY" --profile minimal
        echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"

    - name: install cargo-fuzz
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: cargo-fuzz

    # The target triple is passed explicitly: the prebuilt cargo-fuzz
    # binary otherwise defaults to the triple *it* was compiled for (musl),
    # which has no std installed on the runner.
    - name: build and smoke-run the fuzz target
      run: |
        cargo +"$NIGHTLY" fuzz run add \
          --target "$(rustc +"$NIGHTLY" -vV | sed -n 's/^host: //p')" \
          -- -max_total_time=15

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Codecov upload below is optional (dashboard only) and must not
    # fail the gate when the token is absent — a fresh repository generated
    # from this template has no CODECOV_TOKEN secret. A secret cannot be
    # used in `if:` directly, so it is routed through job-level env.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443
          cli.codecov.io:443
          api.codecov.io:443
          ingest.codecov.io:443
          storage.googleapis.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: |
        rustup toolchain install
        rustup component add llvm-tools

    - name: install cargo-llvm-cov
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: cargo-llvm-cov

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    # The threshold is enforced here, in-job, so the coverage gate is real
    # with no external service. The floor lives in coverage-floor.txt, the
    # one place it is written down (with the reasoning behind its value),
    # and scripts/verify.sh's coverage check reads the same file, so this
    # job and the local suite cannot drift apart.
    - name: read the coverage floor
      run: |
        floor=$(grep -Ev '^[[:space:]]*(#|$)' coverage-floor.txt | tr -d '[:space:]')
        [ -n "$floor" ] || { echo "coverage-floor.txt holds no number" >&2; exit 1; }
        echo "COVERAGE_FLOOR=$floor" >> "$GITHUB_ENV"

    - name: measure coverage (fail under the line floor)
      run: cargo llvm-cov --locked --fail-under-lines "$COVERAGE_FLOOR" --lcov --output-path lcov.info

    # Job summary: the measured line coverage and the enforced floor, read
    # back from the lcov report already generated above (LH/LF sums are the
    # lines-hit / lines-found totals) — no second instrumented run.
    - name: append coverage to the job summary
      if: always()
      run: |
        [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f lcov.info ] || exit 0
        pct=$(awk -F: '/^LF:/ {lf+=$2} /^LH:/ {lh+=$2} END {if (lf > 0) printf "%.2f", 100*lh/lf; else printf "n/a"}' lcov.info)
        {
          echo "### Coverage"
          echo ""
          echo "| Line coverage | Enforced floor |"
          echo "| ---: | ---: |"
          echo "| ${pct}% | ${COVERAGE_FLOOR}% |"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: upload coverage to Codecov (dashboard only, needs CODECOV_TOKEN)
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        files: lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}

  # The three toolchain pins (rust-toolchain.toml, Dockerfile, Cargo.toml)
  # must agree; the check is a script so verify.sh and CI share one engine.
  toolchain-pins:
    name: toolchain pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: check the pins agree
      run: ./scripts/check-toolchain.sh

    # The rewrite the Dependabot toolchain workflow runs on a base image
    # bump: a planted patch and minor bump fail the check above and pass
    # after it.
    - name: sync-toolchain self-test
      run: ./scripts/sync-toolchain.sh --self-test

  # setup.sh is the first thing an adopter runs, and nothing else exercises
  # it. The self-test runs it against a copy named
  # example-owner/Fake-Widget_2 with a stubbed GitHub CLI, fails on any
  # template name left behind (NOTICE included) or a settings field dropped,
  # proves its scan catches two planted leftovers, then builds and tests
  # the renamed project.
  setup-self-test:
    name: setup self-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: rustup toolchain install

    - name: rename a copy, scan it, build and test it
      run: ./scripts/setup.sh --self-test

  # Files this repository shares with modern-webapp-template (listed in
  # .template-parity) must stay byte-identical to the template's default
  # branch. The self-test plants a drifted and a missing file first.
  template-parity:
    name: template parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: prove the check can fail
      run: ./scripts/check-template-parity.sh --self-test

    - name: shared files match modern-webapp-template
      run: ./scripts/check-template-parity.sh

  # Flags known-vulnerable dependencies introduced by a PR, from the diff of
  # the dependency graph (cargo, actions and docker ecosystems here).
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high

  # Mutation testing of the changed code: mutates every line the PR touches
  # and fails if the test suite notices nothing. Extends the verify suite's
  # single mutation canary to the whole diff.
  mutants:
    name: mutation testing (cargo-mutants, diff only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: install cargo-mutants
      uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
      with:
        tool: cargo-mutants

    - name: mutate the diff
      run: |
        git diff "origin/${{ github.base_ref }}"... > pr.diff
        cargo mutants --in-diff pr.diff --timeout-multiplier 3 -- --locked

    - name: mutants report
      if: failure()
      run: cat mutants.out/missed.txt 2>/dev/null || true

    # Job summary: caught/missed counts from the outcome directory
    # cargo-mutants writes (mutants.out). Skips gracefully when it is
    # absent — e.g. a PR whose diff touches no mutable code.
    - name: append mutation outcomes to the job summary
      if: always()
      run: |
        [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -d mutants.out ] || exit 0
        caught=$(grep -c . mutants.out/caught.txt 2>/dev/null || true)
        missed=$(grep -c . mutants.out/missed.txt 2>/dev/null || true)
        {
          echo "### Mutation testing (diff only)"
          echo ""
          echo "| Caught | Missed |"
          echo "| ---: | ---: |"
          echo "| ${caught:-0} | ${missed:-0} |"
        } >> "$GITHUB_STEP_SUMMARY"

  # Lint the linters: actionlint validates the workflow files themselves and
  # shellcheck validates the repository's shell scripts, so a broken CI gate
  # or verify script cannot merge quietly. Both come from the digest-pinned
  # `actionlint` stage of the Dockerfile (which carries the pinned
  # shellcheck), the one place their versions are written and the place
  # Dependabot bumps them.
  lint-workflows:
    name: lint workflows and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        # Audit, not block: this job builds and runs a container, and
        # container-side DNS bypasses harden-runner's resolver, so blocked
        # lookups surface as refused raw-IP dials. Host-process jobs stay on
        # block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: build the pinned linters
      run: docker build --target actionlint -t lint-tools .

    - name: shellcheck and actionlint versions
      run: |
        docker run --rm --entrypoint shellcheck lint-tools --version
        docker run --rm lint-tools -version

    - name: actionlint over the workflows (embedded shell through the pinned shellcheck)
      run: docker run --rm -v "$PWD":/repo -w /repo lint-tools -color -shellcheck /usr/local/bin/shellcheck

    - name: shellcheck over the scripts
      run: docker run --rm -v "$PWD":/repo -w /repo --entrypoint shellcheck lint-tools scripts/*.sh

    # verify.sh skips a check whose prerequisite failed and names the
    # failure. Its self-test runs it on copies of the tree with cargo and the
    # other checkers stubbed, so it needs only the runner's shell tools.
    - name: verify.sh self-test (a failed check stops the checks that need it)
      run: ./scripts/verify.sh --self-test

  # Prose: every tracked Markdown file against the writing rules in
  # .vale/styles/Abera, the same check verify.sh runs, self-test first. On
  # the runner rather than in the toolchain container: the rules run in the
  # Vale image the Dockerfile pins, so the check needs Docker.
  attribution:
    name: attribution (no AI credit in commits)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # The check reads every commit this pull request would add, and a
        # shallow clone has no merge base to measure that range from.
        fetch-depth: 0
        persist-credentials: false

    - name: prove the check can fail
      run: ./scripts/check-attribution.sh --self-test

    - name: no commit in this pull request credits an AI
      run: ./scripts/check-attribution.sh "origin/${GITHUB_BASE_REF}..HEAD"

  prose:
    name: prose
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        # Audit, not block: this job runs a container, and container-side
        # DNS bypasses harden-runner's resolver, so blocked lookups surface as
        # refused raw-IP dials. Host-process jobs stay on block.
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: prove every rule fires, then lint every tracked Markdown file
      run: |
        ./scripts/check-prose.sh --self-test
        ./scripts/check-prose.sh

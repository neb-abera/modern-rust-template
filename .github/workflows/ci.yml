name: CI

on:
  # Unfiltered pull_request: filtering on the default branch leaves a PR
  # stacked on another feature branch with no checks at all.
  pull_request:
  push:
    branches: [ main, master ]

# Least-privilege token: read-only for all CI jobs.
permissions:
  contents: read

# A newer push to the same branch makes the running check obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # The lint set lives in Cargo.toml [lints]; CI only promotes warnings to
  # errors. Locally the same code merely warns, so development stays fluid.
  RUSTFLAGS: -D warnings
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - name: harden runner (Linux)
      if: runner.os == 'Linux'
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # rustup reads rust-toolchain.toml, so the version is pinned in exactly
    # one place and never hardcoded here.
    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: build
      run: cargo build --release --locked

    - name: run tests
      run: cargo test --release --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: run clippy over every target
      run: cargo clippy --all-targets --locked

  rustfmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: rustup toolchain install

    - name: check formatting
      run: cargo fmt --check

  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: build documentation (warnings as errors)
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --no-deps --lib --locked

  # Miri interprets the test suite and flags undefined behavior — the
  # Rustonomicon material as a gate. Uses the nightly pinned in the
  # Dockerfile, the single place it is written down.
  miri:
    name: miri
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned nightly with Miri
      run: |
        NIGHTLY=$(sed -n 's/^ENV NIGHTLY_TOOLCHAIN=\(.*\)$/\1/p' Dockerfile)
        rustup toolchain install "$NIGHTLY" --profile minimal --component miri --component rust-src
        echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    # RUSTFLAGS is cleared for Miri only: it changes the sysroot
    # fingerprint, forcing a slow rebuild; warnings-as-errors is already
    # gated by the build and clippy jobs.
    - name: run tests under Miri
      env:
        RUSTFLAGS: ""
      run: cargo +"$NIGHTLY" miri test --locked

  # cargo-deny: the supply-chain gate — RustSec advisories, license
  # compliance, duplicate/banned crates and untrusted sources (deny.toml).
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  # libFuzzer smoke: the fuzz harness builds and survives a short
  # coverage-guided run. Real fuzzing campaigns run longer or continuously
  # (see the fuzz directory); this gate keeps the harness from rotting.
  fuzz:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned nightly
      run: |
        NIGHTLY=$(sed -n 's/^ENV NIGHTLY_TOOLCHAIN=\(.*\)$/\1/p' Dockerfile)
        rustup toolchain install "$NIGHTLY" --profile minimal
        echo "NIGHTLY=$NIGHTLY" >> "$GITHUB_ENV"

    - name: install cargo-fuzz
      uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
      with:
        tool: cargo-fuzz

    # The target triple is passed explicitly: the prebuilt cargo-fuzz
    # binary otherwise defaults to the triple *it* was compiled for (musl),
    # which has no std installed on the runner.
    - name: build and smoke-run the fuzz target
      run: |
        cargo +"$NIGHTLY" fuzz run add \
          --target "$(rustc +"$NIGHTLY" -vV | sed -n 's/^host: //p')" \
          -- -max_total_time=15

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The Codecov upload below is optional (dashboard only) and must not
    # fail the gate when the token is absent — a fresh repository generated
    # from this template has no CODECOV_TOKEN secret. A secret cannot be
    # used in `if:` directly, so it is routed through job-level env.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443
          cli.codecov.io:443
          api.codecov.io:443
          ingest.codecov.io:443
          storage.googleapis.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install pinned toolchain
      run: |
        rustup toolchain install
        rustup component add llvm-tools

    - name: install cargo-llvm-cov
      uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
      with:
        tool: cargo-llvm-cov

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    # The threshold is enforced here, in-job, so the coverage gate is real
    # with no external service. The template's placeholder code measures
    # 76% of lines (src/main.rs is exercised by the verify suite's
    # executable smoke test, not by unit tests); 70 leaves a little headroom
    # out of the box. Raise it as your project's tests grow.
    - name: measure coverage (fail under 70% of lines)
      run: cargo llvm-cov --locked --fail-under-lines 70 --lcov --output-path lcov.info

    - name: upload coverage to Codecov (dashboard only, needs CODECOV_TOKEN)
      if: env.CODECOV_TOKEN != ''
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        files: lcov.info
        token: ${{ secrets.CODECOV_TOKEN }}

  # The three toolchain pins (rust-toolchain.toml, Dockerfile, Cargo.toml)
  # must agree; the check is a script so verify.sh and CI share one engine.
  toolchain-pins:
    name: toolchain pins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: check the pins agree
      run: ./scripts/check-toolchain.sh

  # Flags known-vulnerable dependencies introduced by a PR, from the diff of
  # the dependency graph (cargo, actions and docker ecosystems here).
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high

  # Mutation testing of the changed code: mutates every line the PR touches
  # and fails if the test suite notices nothing. Extends the verify suite's
  # single mutation canary to the whole diff.
  mutants:
    name: mutation testing (cargo-mutants, diff only)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          uploads.github.com:443
          static.crates.io:443
          index.crates.io:443
          crates.io:443
          static.rust-lang.org:443
          ghcr.io:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          pkg-containers.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: install pinned toolchain
      run: rustup toolchain install

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

    - name: install cargo-mutants
      uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2.87.1
      with:
        tool: cargo-mutants

    - name: mutate the diff
      run: |
        git diff "origin/${{ github.base_ref }}"... > pr.diff
        cargo mutants --in-diff pr.diff --timeout-multiplier 3 -- --locked

    - name: mutants report
      if: failure()
      run: cat mutants.out/missed.txt 2>/dev/null || true

  # Lint the linters: actionlint validates the workflow files themselves and
  # shellcheck validates the repository's shell scripts, so a broken CI gate
  # or verify script cannot merge quietly. actionlint is a pinned release
  # binary verified by checksum; shellcheck is preinstalled on the runner
  # image (actionlint also invokes it for run: blocks inside the workflows).
  lint-workflows:
    name: lint workflows and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443
          api.github.com:443
          codeload.github.com:443
          raw.githubusercontent.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: install actionlint (pinned, checksum-verified)
      run: |
        curl -sSfL -o actionlint.tar.gz \
          https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
        echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
        tar -xzf actionlint.tar.gz actionlint

    - name: actionlint over the workflows
      run: ./actionlint -color

    - name: shellcheck over the scripts
      run: shellcheck scripts/*.sh

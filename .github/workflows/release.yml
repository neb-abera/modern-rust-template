name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege token: jobs are read-only except the release job below.
permissions:
  contents: read

# One release at a time, never cancelled mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: install pinned toolchain
      run: rustup toolchain install

    - name: build
      run: cargo build --release --locked

    - name: run tests
      run: cargo test --release --locked

    # The crate (and so binary) name is read from Cargo.toml, so a rename
    # via scripts/setup.sh needs no edits here. github.ref_name is passed
    # through env rather than interpolated into the script: tag names may
    # contain shell metacharacters.
    - name: package
      env:
        TAG: ${{ github.ref_name }}
      run: |
        BIN=$(sed -n 's/^name = "\(.*\)"$/\1/p' Cargo.toml | head -1)
        mkdir staging
        if [ "$RUNNER_OS" = "Windows" ]; then
          cp "target/release/$BIN.exe" LICENSE README.md staging/
          7z a "$BIN-$RUNNER_OS-$TAG.zip" ./staging/*
        else
          cp "target/release/$BIN" LICENSE README.md staging/
          tar -czf "$BIN-$RUNNER_OS-$TAG.tar.gz" -C staging .
        fi

    - name: upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ runner.os }}-${{ github.ref_name }}
        path: |
          *.tar.gz
          *.zip

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: harden runner
      uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
      with:
        egress-policy: audit

    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        merge-multiple: true

    # SLSA build provenance for the packaged binaries; consumers verify
    # with 'gh attestation verify <file> --repo <owner>/<repo>'.
    - name: attest artifact provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: artifacts/*

    # SBOM for the release, generated from the lockfile that produced the
    # binaries and attached to the GitHub Release so consumers can audit
    # the dependency tree without reconstructing it.
    - name: generate SBOM
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        path: .
        format: spdx-json
        output-file: sbom.spdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: create release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        gh release create "$TAG" artifacts/* sbom.spdx.json \
          --repo "${{ github.repository }}" \
          --title "Release $TAG" \
          --generate-notes
